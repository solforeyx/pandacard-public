<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Page Not Found — Panda Card</title>
  <meta name="theme-color" content="#FFD700" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #F8F8FC;
      color: #1A1A2E;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card { max-width: 380px; width: 100%; }
    .code { font-size: 72px; font-weight: 900; color: #FFD700; line-height: 1; }
    h1 { font-size: 22px; font-weight: 800; margin: 12px 0 8px; }
    p { font-size: 14px; color: #666; line-height: 1.6; margin-bottom: 24px; }
    a {
      display: inline-block;
      background: #FFD700;
      color: #1A1A2E;
      text-decoration: none;
      border-radius: 50px;
      padding: 14px 32px;
      font-size: 15px;
      font-weight: 700;
      transition: transform 0.15s;
    }
    a:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="/app.html">Go to App</a>
  </div>
</body>
</html>
